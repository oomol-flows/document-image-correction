title: "%test-document-image-correction%"
nodes:
  - node_id: document-enhancement#1
    task: self::document-image-correction
    inputs_from:
      - handle: input_image
        value: /oomol-driver/oomol-storage/image/ff8f7869d34add21834a173a058d9305.jpg
      - handle: enable_illumination_correction
        value: true
  - node_id: image_preview#1
    title: "%enhanced-result-preview%"
    inputs_from:
      - handle: image_path
        from_node:
          - node_id: document-enhancement#1
            output_handle: output_image
    task: oomol-preview::image_preview
