inputs_def:
  - handle: input_image
    description: "%input-document-image-can-have-distortion-and-or-poor-lighting%"
    json_schema:
      type: string
      ui:widget: file
      ui:options:
        filters:
          - name: Image Files
            extensions:
              - jpg
              - jpeg
              - png
              - bmp
              - tiff
    nullable: false

  - handle: enable_illumination_correction
    description: "%enable-illumination-correction-before-geometric-correction%"
    json_schema:
      type: boolean
    value: true
    nullable: false

outputs_def:
  - handle: output_image
    description: "Enhanced document image path (with illumination and geometric
      corrections applied)"
    json_schema:
      type: string

executor:
  name: python
  options:
    entry: __init__.py
    spawn: false

title: "%document-image-correction%"
icon: ":carbon:document-tasks:"
description: "%this-block-provides-complete-document-image-enhancement-by-combi%"
